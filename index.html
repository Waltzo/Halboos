<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>할부 계산기 · halboos</title>
    <meta name="description" content="카드 할부·고정지출을 월별로 모아보는 계산기" />
    <meta name="theme-color" content="#e8ecf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <!-- 테마 플래시 방지: CSS/JS 번들보다 먼저 동기 실행되어야 한다.
         'system' 이면 아무것도 붙이지 않아 :root 기본값 + 미디어쿼리가 그대로 동작. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('halboos-theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
